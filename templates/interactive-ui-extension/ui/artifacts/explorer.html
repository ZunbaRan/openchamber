<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__EXTENSION_NAME__ Explorer</title>
  <style>
    :root { color: var(--ocix-foreground); font: 14px/1.45 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; color: var(--ocix-foreground); background: var(--ocix-surface); }
    header, .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 18px; }
    .subtle { color: var(--ocix-muted-foreground); }
    .canvas { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
    .card { min-height: 120px; padding: 14px; border: 1px solid var(--ocix-border); border-radius: 12px; background: var(--ocix-surface-muted); }
    .value { margin-top: 8px; font-size: 28px; font-weight: 650; }
    button { border: 1px solid var(--ocix-border); border-radius: 9px; padding: 8px 12px; color: var(--ocix-primary-foreground); background: var(--ocix-primary); cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    #status { min-height: 22px; margin-top: 12px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>__EXTENSION_NAME__ Explorer</h1>
      <div class="subtle">Signed third-party HTML Artifact · data via OpenChamber Business Gateway</div>
    </div>
    <button id="refresh" type="button">Refresh</button>
  </header>
  <main id="canvas" class="canvas" aria-live="polite"></main>
  <div class="toolbar">
    <div id="status" class="subtle">Waiting for OpenChamber Host…</div>
    <button id="approve" type="button">Approve selected</button>
  </div>
  <script>
    const canvas = document.querySelector('#canvas');
    const status = document.querySelector('#status');
    const refresh = document.querySelector('#refresh');
    const approve = document.querySelector('#approve');
    let selectedId = 'sample-item';

    const render = (payload) => {
      const entries = Object.entries(payload && typeof payload === 'object' ? payload : { result: payload });
      canvas.replaceChildren(...entries.slice(0, 8).map(([label, value]) => {
        const card = document.createElement('article');
        card.className = 'card';
        const heading = document.createElement('div');
        heading.className = 'subtle';
        heading.textContent = label;
        const content = document.createElement('div');
        content.className = 'value';
        content.textContent = typeof value === 'object' ? JSON.stringify(value) : String(value);
        card.append(heading, content);
        return card;
      }));
    };

    const load = async () => {
      refresh.disabled = true;
      status.textContent = 'Loading authoritative data…';
      try {
        const data = await window.openchamber.business.query('__EXTENSION_ID__.overview.query', { scope: 'default' });
        render(data);
        status.textContent = 'Connected';
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : 'Request failed';
      } finally {
        refresh.disabled = false;
      }
    };

    refresh.addEventListener('click', load);
    approve.addEventListener('click', async () => {
      approve.disabled = true;
      try {
        await window.openchamber.business.execute('__EXTENSION_ID__.item.approve', { id: selectedId });
        status.textContent = 'Update completed';
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : 'Update failed';
      } finally {
        approve.disabled = false;
      }
    });
    addEventListener('openchamber:host-init', load, { once: true });
  </script>
</body>
</html>
