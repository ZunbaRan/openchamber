<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>订单详情</title>
  <style>
    :root { color: var(--ocix-foreground); font: 14px/1.5 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; color: var(--ocix-foreground); background: var(--ocix-surface); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 18px; }
    .badge { border: 1px solid var(--ocix-border); border-radius: 999px; padding: 4px 9px; color: var(--ocix-muted-foreground); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
    .card { min-width: 0; padding: 14px; border: 1px solid var(--ocix-border); border-radius: 12px; background: var(--ocix-surface-muted); }
    .label { color: var(--ocix-muted-foreground); }
    .value { margin-top: 6px; overflow-wrap: anywhere; font-size: 18px; font-weight: 650; }
    #status { margin-top: 14px; color: var(--ocix-muted-foreground); }
    @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>订单详情</h1>
    <span class="badge">HTML Artifact</span>
  </header>
  <main class="grid" aria-live="polite">
    <article class="card"><div class="label">订单 ID</div><div class="value" id="order-id">等待 Host…</div></article>
    <article class="card"><div class="label">区域 / 月份</div><div class="value" id="scope">—</div></article>
  </main>
  <div id="status">等待 OpenChamber Host Context…</div>
  <script>
    const orderId = document.querySelector('#order-id');
    const scope = document.querySelector('#scope');
    const status = document.querySelector('#status');
    addEventListener('openchamber:host-init', (event) => {
      const context = event.detail && event.detail.context || {};
      orderId.textContent = String(context.orderId || '缺少 orderId');
      scope.textContent = [context.region, context.period].filter(Boolean).join(' · ') || '—';
      status.textContent = context.orderId ? '已接收声明式联动 Context' : '该 Surface 需要 orderId';
    }, { once: true });
  </script>
</body>
</html>
